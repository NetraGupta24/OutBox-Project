name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build -w backend && npm run build -w frontend

  integration:
    name: Integration tests (MySQL, Redis, Elasticsearch)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reachinbox_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      elasticsearch:
        image: elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: mysql://root:root@localhost:3306/reachinbox_test
      TEST_REDIS_URL: redis://localhost:6379/15
      ELASTICSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration -w backend
      - name: Rate limiter load test (1,000+ emails, simulated clock)
        run: npm run load-test -w backend
        env:
          REDIS_URL: redis://localhost:6379/14
          # Required by config validation; the load test only uses Redis.
          DATABASE_URL: mysql://root:root@localhost:3306/reachinbox_test
          ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend (API and worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: false
      - name: Backend tools (migrations)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: tools
          push: false
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
